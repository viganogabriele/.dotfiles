# Spegnimento display in idle.
# Lock e screensaver restano gestiti da omarchy-shell (~/.config/omarchy/shell.json,
# blocco "idle"): il suo servizio non espone nessun timeout DPMS, quindi senza
# questo file il monitor resta acceso all'infinito.

general {
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    after_sleep_cmd = hyprctl dispatch dpms on
}

# omarchy-shell blocca a 300s; il display si spegne 2 minuti dopo.
listener {
    timeout = 420
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
