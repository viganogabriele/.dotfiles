# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm-app -- ghostty
$editor = code
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT, A, Chromium, exec, chromium
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, C, Editor, exec, $editor
bindd = SUPER SHIFT, K, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, P, Passwords, exec, uwsm-app -- 1password
bindd = SUPER SHIFT, T, Telegram, exec, omarchy-launch-or-focus Telegram
bindd = SUPER SHIFT, D, T3 Code (Fixed), exec, omarchy-launch-or-focus t3code "t3code-nightly --password-store=gnome-libsecret"
bindd = SUPER SHIFT, O, Btop, exec, omarchy-launch-or-focus Btop "omarchy-launch-tui btop"

# Web apps
bindd = SUPER SHIFT, G, Gemini, exec, omarchy-launch-webapp "https://gemini.google.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

# Media control using Super + Alt + Arrows
bind = SUPER ALT, right, exec, playerctl next
bind = SUPER ALT, left, exec, playerctl previous

# split-monitor-workspaces plugin: true per-monitor workspaces.
# Monitor 1 gets workspaces 1-10, monitor 2 gets 11-20, etc. The numbers
# 1-10 always mean "this monitor's Nth workspace" (resolved by mouse position).
plugin {
    split-monitor-workspaces {
        count = 10
        keep_focused = 0
        enable_notifications = 0
        enable_persistent_workspaces = 1
        enable_wrapping = 1
        link_monitors = 0
    }
}

# Unbind Omarchy's global-workspace-id binds so the plugin's binds below take over
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19
unbind = SUPER SHIFT, code:10
unbind = SUPER SHIFT, code:11
unbind = SUPER SHIFT, code:12
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, code:14
unbind = SUPER SHIFT, code:15
unbind = SUPER SHIFT, code:16
unbind = SUPER SHIFT, code:17
unbind = SUPER SHIFT, code:18
unbind = SUPER SHIFT, code:19
unbind = SUPER SHIFT ALT, code:10
unbind = SUPER SHIFT ALT, code:11
unbind = SUPER SHIFT ALT, code:12
unbind = SUPER SHIFT ALT, code:13
unbind = SUPER SHIFT ALT, code:14
unbind = SUPER SHIFT ALT, code:15
unbind = SUPER SHIFT ALT, code:16
unbind = SUPER SHIFT ALT, code:17
unbind = SUPER SHIFT ALT, code:18
unbind = SUPER SHIFT ALT, code:19
unbind = SUPER, TAB
unbind = SUPER SHIFT, TAB
unbind = SUPER, mouse_down
unbind = SUPER, mouse_up

bindd = SUPER, code:10, Switch to workspace 1 (current monitor), split-workspace, 1
bindd = SUPER, code:11, Switch to workspace 2 (current monitor), split-workspace, 2
bindd = SUPER, code:12, Switch to workspace 3 (current monitor), split-workspace, 3
bindd = SUPER, code:13, Switch to workspace 4 (current monitor), split-workspace, 4
bindd = SUPER, code:14, Switch to workspace 5 (current monitor), split-workspace, 5
bindd = SUPER, code:15, Switch to workspace 6 (current monitor), split-workspace, 6
bindd = SUPER, code:16, Switch to workspace 7 (current monitor), split-workspace, 7
bindd = SUPER, code:17, Switch to workspace 8 (current monitor), split-workspace, 8
bindd = SUPER, code:18, Switch to workspace 9 (current monitor), split-workspace, 9
bindd = SUPER, code:19, Switch to workspace 10 (current monitor), split-workspace, 10

bindd = SUPER SHIFT, code:10, Move window to workspace 1 (current monitor), split-movetoworkspacesilent, 1
bindd = SUPER SHIFT, code:11, Move window to workspace 2 (current monitor), split-movetoworkspacesilent, 2
bindd = SUPER SHIFT, code:12, Move window to workspace 3 (current monitor), split-movetoworkspacesilent, 3
bindd = SUPER SHIFT, code:13, Move window to workspace 4 (current monitor), split-movetoworkspacesilent, 4
bindd = SUPER SHIFT, code:14, Move window to workspace 5 (current monitor), split-movetoworkspacesilent, 5
bindd = SUPER SHIFT, code:15, Move window to workspace 6 (current monitor), split-movetoworkspacesilent, 6
bindd = SUPER SHIFT, code:16, Move window to workspace 7 (current monitor), split-movetoworkspacesilent, 7
bindd = SUPER SHIFT, code:17, Move window to workspace 8 (current monitor), split-movetoworkspacesilent, 8
bindd = SUPER SHIFT, code:18, Move window to workspace 9 (current monitor), split-movetoworkspacesilent, 9
bindd = SUPER SHIFT, code:19, Move window to workspace 10 (current monitor), split-movetoworkspacesilent, 10

# Cycle only through the current monitor's own workspaces
bindd = SUPER, TAB, Next workspace (current monitor), split-cycleworkspaces, +1
bindd = SUPER SHIFT, TAB, Previous workspace (current monitor), split-cycleworkspaces, -1
bindd = SUPER, mouse_down, Scroll active workspace forward (current monitor), split-cycleworkspaces, +1
bindd = SUPER, mouse_up, Scroll active workspace backward (current monitor), split-cycleworkspaces, -1

# Move focus + cursor to another monitor without touching any window
# code:34 / code:35 = the two physical keys right after "P" on the top row
# (on an Italian keyboard: the "e-grave" key and the "+" key next to it)
bindd = SUPER, code:34, Focus previous monitor, focusmonitor, -1
bindd = SUPER, code:35, Focus next monitor, focusmonitor, +1

# Move the active window to another monitor and follow it there
bindd = SUPER SHIFT, code:34, Move window to previous monitor, split-changemonitor, -1
bindd = SUPER SHIFT, code:35, Move window to next monitor, split-changemonitor, +1